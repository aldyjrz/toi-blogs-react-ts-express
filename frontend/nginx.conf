server {
  listen 8081;
  server_name blog.aldytoi.my.id;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://backend:4000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api-docs {
    proxy_pass http://backend:4000/api-docs;
    proxy_set_header Host $host;
  }

  location = /sitemap.xml {
    proxy_pass http://backend:4000/sitemap.xml;
    proxy_set_header Host $host;
  }

  location = /robots.txt {
    proxy_pass http://backend:4000/robots.txt;
    proxy_set_header Host $host;
  }

  location = /rss.xml {
    proxy_pass http://backend:4000/rss.xml;
    proxy_set_header Host $host;
  }

  location = /manifest.json {
    proxy_pass http://backend:4000/manifest.json;
    proxy_set_header Host $host;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
